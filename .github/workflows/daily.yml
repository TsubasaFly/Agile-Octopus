name: Daily Octopus Agile Slack Alert

on:
  schedule:
    # UTC 15:02 = 英国夏令时(BST) 下午 16:02（带 2 分钟偏移，完美避开整点高峰）
    - ccron: '45 10 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OCTOPUS_REGION_CODE: "C"
        run: python main.py
